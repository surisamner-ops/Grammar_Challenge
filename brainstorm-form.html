<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainstorm - Submit Your Word</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comfortaa', cursive;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Звёздный фон */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes shootingStar {
            0% { transform: translateX(0) translateY(0) rotate(-35deg); opacity: 0; }
            15% { opacity: 0.6; }
            50% { opacity: 0.9; }
            85% { opacity: 0.6; }
            100% { transform: translateX(150vw) translateY(100vh) rotate(-35deg); opacity: 0; }
        }
        @keyframes magicParticles {
            0% { opacity: 0; transform: translateY(0) translateX(0) scale(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(50px) scale(1); }
        }
        @keyframes windowGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(192, 132, 252, 0.2), 0 0 60px rgba(192, 132, 252, 0.1); }
            50% { box-shadow: 0 0 50px rgba(192, 132, 252, 0.4), 0 0 80px rgba(192, 132, 252, 0.2), 0 0 100px rgba(96, 165, 250, 0.15); }
        }
        @keyframes inputGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(192, 132, 252, 0.3); }
            50% { box-shadow: 0 0 50px rgba(192, 132, 252, 0.5), 0 0 70px rgba(192, 132, 252, 0.3); }
        }
        
        .container {
            position: relative;
            z-index: 2;
            max-width: 650px; /* Увеличили ширину */
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .question {
            color: #c4b5fd;
            font-size: 1.2em;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .input-section {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 24px;
            padding: 40px; /* Увеличили отступы внутри */
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.2);
            animation: windowGlow 3s ease-in-out infinite; /* Пульсирующее свечение окна */
        }
        .input-section textarea {
            width: 100%;
            padding: 18px 25px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(192, 132, 252, 0.5);
            border-radius: 16px;
            color: white;
            font-size: 1.2em;
            font-family: 'Comfortaa', cursive;
            margin-bottom: 20px;
            text-align: center;
            resize: vertical;
            min-height: 100px; /* Многострочное поле */
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.3);
            animation: inputGlow 2s ease-in-out infinite;
        }
        .input-section textarea:focus {
            outline: none;
            border-color: #c084fc;
            box-shadow: 0 0 50px rgba(192, 132, 252, 0.6), 0 0 80px rgba(192, 132, 252, 0.4);
        }
        .input-section textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .input-section button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.4);
        }
        .input-section button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 30px rgba(192, 132, 252, 0.6);
        }
        .status {
            margin-top: 15px;
            min-height: 20px;
            font-size: 1em;
            font-weight: 600;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .loading { color: #fbbf24; }
    </style>
</head>
<body>
    <div class="stars-bg" id="starsContainer"></div>
    
    <div class="container">
        <h1>🧠 Live Brainstorm</h1>
        <p class="question">What words or phrases come to mind when you think about grammar?</p>
        
        <div class="input-section">
            <textarea id="wordInput" placeholder="Type your word or phrase here..." maxlength="150" autocomplete="off" rows="3"></textarea>
            <button onclick="submitWord()">Submit ✨</button>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzRQlr3v51D5GJ1QS7lhmmVyefuhH5HZ-49IWSwEgW0xhnyiadULpIOfPK2PCdaZUGa/exec';
        const wordInput = document.getElementById('wordInput');
        const status = document.getElementById('status');
        
        function createStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 400; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--max-opacity', Math.random() * 0.7 + 0.3);
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
            for (let i = 0; i < 10; i++) {
                const shootingStar = document.createElement('div');
                shootingStar.style.position = 'absolute';
                shootingStar.style.width = '150px';
                shootingStar.style.height = '1px';
                shootingStar.style.background = 'linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.3) 30%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.3) 70%, rgba(255,255,255,0))';
                shootingStar.style.top = Math.random() * 50 + '%';
                shootingStar.style.left = '-' + Math.random() * 20 + '%';
                shootingStar.style.transform = 'rotate(-35deg)';
                shootingStar.style.filter = 'blur(0.5px)';
                shootingStar.style.animation = `shootingStar ${Math.random() * 6 + 10}s ease-in-out ${Math.random() * 15}s infinite`;
                container.appendChild(shootingStar);
            }
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = '4px';
                particle.style.height = '4px';
                particle.style.background = 'rgba(192, 132, 252, 0.8)';
                particle.style.borderRadius = '50%';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.boxShadow = '0 0 10px rgba(192, 132, 252, 0.8)';
                particle.style.animation = `magicParticles ${Math.random() * 4 + 3}s ease-in-out ${Math.random() * 5}s infinite`;
                container.appendChild(particle);
            }
        }
        
        window.addEventListener('load', createStars);
        
        async function submitWord() {
            const word = wordInput.value.trim();
            if (!word) {
                status.textContent = 'Please type a word first!';
                status.className = 'status error';
                return;
            }
            
            status.textContent = 'Sending...';
            status.className = 'status loading';
            
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word: word, question: 'brainstorm' })
                });
                
                wordInput.value = '';
                status.textContent = '✅ Thank you! Your word has been added.';
                status.className = 'status success';
                
                setTimeout(() => {
                    status.textContent = '';
                }, 3000);
            } catch (e) {
                status.textContent = 'Error. Please try again.';
                status.className = 'status error';
            }
        }
        
        // Enter отправляет форму, Shift + Enter делает перенос строки
        wordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitWord();
            }
        });
        
        wordInput.focus();
    </script>
</body>
</html>
