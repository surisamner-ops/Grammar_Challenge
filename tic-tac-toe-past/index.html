<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ Past Tenses Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Outfit:wght@300;400;600;800&family=Fredoka:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f0c29; --bg-mid: #302b63; --bg-light: #24243e;
            --glass-bg: rgba(255, 255, 255, 0.08); --glass-border: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.25); --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75); --accent-primary: #ff6b9d;
            --accent-secondary: #7b68ee; --accent-gold: #ffd93d;
            --success: #00d9a5; --error: #ff6b6b;
            --shadow-glow: 0 0 30px rgba(123, 104, 238, 0.4);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.4);
            --font-display: 'Fredoka', sans-serif; --font-body: 'Outfit', sans-serif;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: var(--text-primary); font-family: var(--font-body);
            min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; position: relative;
        }
        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration, 3s) ease-in-out infinite var(--delay, 0s); opacity: 0; }
        @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: var(--opacity, 0.8); transform: scale(1); } }
        .app-container { position: relative; z-index: 10; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Заголовок */
        .main-header { text-align: center; padding: 30px 20px 10px; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #c084fc; text-decoration: none; font-weight: 600; font-family: 'Comfortaa', cursive; }
        .back-link:hover { color: #e9d5ff; }
        .main-header h1 {
            font-family: 'Comfortaa', cursive; font-size: 2.2em; font-weight: 700;
            background: linear-gradient(135deg, #c084fc 0%, #60a5fa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .main-header p { font-size: 1em; color: #94a3b8; font-family: 'Inter', sans-serif; }
        
        /* Форма имени */
        .student-form {
            background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px;
            padding: 35px; text-align: center; max-width: 450px; margin: 30px auto;
        }
        .student-form h2 { font-family: 'Comfortaa', cursive; font-size: 1.6em; margin-bottom: 15px; color: #c084fc; }
        .student-form p { margin-bottom: 20px; color: #94a3b8; font-family: 'Inter', sans-serif; }
        .name-input {
            width: 100%; max-width: 280px; padding: 12px 18px;
            background: rgba(0, 0, 0, 0.3); border: 2px solid rgba(192, 132, 252, 0.3);
            border-radius: 12px; color: #fff; font-size: 1em; text-align: center; margin-bottom: 15px;
            font-family: 'Inter', sans-serif;
        }
        .name-input::placeholder { color: rgba(255, 255, 255, 0.3); }
        .name-input:focus { outline: none; border-color: #c084fc; box-shadow: 0 0 20px rgba(192, 132, 252, 0.3); }
        .btn-start {
            padding: 12px 35px; background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
            color: white; border: none; border-radius: 50px; font-family: 'Comfortaa', cursive;
            font-size: 1em; font-weight: 700; cursor: pointer; transition: transform 0.3s;
        }
        .btn-start:hover { transform: translateY(-3px); }
        
        /* Игровое поле */
        .game-area { flex: 1; display: none; flex-direction: column; align-items: center; padding: 10px 20px 30px; }
        .game-area.show { display: flex; }
        
        .timer-bar {
            position: sticky; top: 10px; z-index: 100;
            background: rgba(192, 132, 252, 0.15); border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 50px; padding: 8px 20px; text-align: center; margin-bottom: 20px;
            font-family: 'Comfortaa', cursive; font-size: 1em; color: #e9d5ff;
            backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .timer-bar .tab-warning { color: #fbbf24; font-weight: 700; animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .game-header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 520px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .turn-indicator { font-family: 'Comfortaa', cursive; font-size: 1.1em; color: #e9d5ff; }
        .game-controls { display: flex; gap: 8px; }
        .ctrl-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: var(--text-primary); padding: 6px 14px; border-radius: 10px;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; transition: var(--transition-smooth); backdrop-filter: blur(10px);
        }
        .ctrl-btn:hover { background: var(--glass-highlight); border-color: var(--accent-secondary); transform: translateY(-2px); }
        
        #victory-banner { height: 0; overflow: hidden; transition: height 0.4s ease; margin-bottom: 0; text-align: center; width: 100%; max-width: 500px; }
        #victory-banner.visible { height: 3.5rem; margin-bottom: 10px; }
        #victory-text { font-family: 'Comfortaa', cursive; font-size: 1.4rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-gold), var(--accent-primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; opacity: 0; transform: translateY(-10px); transition: all 0.3s ease 0.1s; }
        #victory-banner.visible #victory-text { opacity: 1; transform: translateY(0); }
        
        .board-container { width: 90vmin; height: 90vmin; max-width: 480px; max-height: 480px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2vmin; padding: 2vmin; background: var(--glass-bg); border-radius: 24px; border: 1px solid var(--glass-border); backdrop-filter: blur(20px); box-shadow: var(--shadow-glow), var(--shadow-soft); position: relative; }
        .cell { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: clamp(2.5rem, 11vmin, 4.5rem); cursor: pointer; transition: var(--transition-smooth); position: relative; user-select: none; }
        .cell:hover:not(.taken):not(.disabled) { background: rgba(255, 255, 255, 0.12); border-color: var(--accent-secondary); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(123, 104, 238, 0.3); }
        .cell.taken { cursor: default; }
        .cell.disabled { cursor: not-allowed; opacity: 0.5; pointer-events: none; filter: grayscale(0.8); }
        .cell.win { background: linear-gradient(135deg, rgba(255,217,61,0.3), rgba(255,107,157,0.3)) !important; border-color: var(--accent-gold) !important; box-shadow: 0 0 30px rgba(255, 217, 61, 0.5) !important; animation: winPulse 1.5s ease-in-out infinite; }
        @keyframes winPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .glyph { font-family: var(--font-display); font-weight: 700; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; z-index: 2; }
        .glyph.x { color: var(--accent-primary); } .glyph.o { color: var(--accent-secondary); }
        @keyframes popIn { from { transform: scale(0) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
        
        footer { background: var(--glass-bg); padding: 12px 20px; display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); margin-top: auto; }
        .score-box { text-align: center; min-width: 70px; padding: 6px 10px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid var(--glass-border); }
        .score-label { font-size: 0.65rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; font-weight: 600; font-family: 'Inter', sans-serif; }
        .score-val { font-family: 'Comfortaa', cursive; font-size: 1.6rem; font-weight: 700; color: var(--accent-gold); }
        
        /* Модальное окно вопроса */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 12, 41, 0.9); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; visibility: hidden; transition: var(--transition-smooth); padding: 1rem; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .quiz-modal { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 1.8rem; width: 100%; max-width: 480px; box-shadow: var(--shadow-glow), var(--shadow-soft); transform: translateY(20px); transition: transform 0.3s ease; position: relative; }
        .modal-overlay.active .quiz-modal { transform: translateY(0); }
        .quiz-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.2rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--glass-border); }
        .quiz-icon { font-size: 1.6rem; animation: bounce 2s ease infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .quiz-title { font-family: 'Comfortaa', cursive; font-size: 1.1rem; font-weight: 700; color: var(--accent-gold); }
        .quiz-question { font-size: 1.05rem; line-height: 1.5; margin-bottom: 1.2rem; font-weight: 400; font-family: 'Inter', sans-serif; }
        .quiz-question span { color: var(--accent-primary); font-weight: 600; border-bottom: 2px solid var(--accent-primary); }
        .quiz-options { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.2rem; }
        .quiz-option { background: rgba(255,255,255,0.08); border: 2px solid var(--glass-border); border-radius: 12px; padding: 0.8rem 1rem; cursor: pointer; transition: var(--transition-smooth); font-size: 0.95rem; display: flex; align-items: center; gap: 0.7rem; font-family: 'Inter', sans-serif; }
        .quiz-option:hover { background: rgba(255,255,255,0.15); border-color: var(--accent-secondary); transform: translateX(5px); }
        .quiz-option.selected { background: rgba(123, 104, 238, 0.3); border-color: var(--accent-secondary); }
        .quiz-option.correct { background: rgba(0, 217, 165, 0.25); border-color: var(--success); animation: correctPulse 0.5s ease; }
        .quiz-option.incorrect { background: rgba(255, 107, 107, 0.25); border-color: var(--error); animation: shake 0.4s ease; }
        @keyframes correctPulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .quiz-option-letter { background: var(--accent-secondary); color: white; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
        .quiz-feedback { min-height: 2rem; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; font-weight: 700; font-size: 1rem; opacity: 0; transform: translateY(10px); transition: var(--transition-smooth); text-align: center; font-family: 'Inter', sans-serif; }
        .quiz-feedback.show { opacity: 1; transform: translateY(0); }
        .quiz-feedback.correct { color: var(--success); }
        .quiz-feedback.incorrect { color: var(--error); }
        .quiz-actions { display: flex; gap: 0.75rem; justify-content: center; }
        .quiz-btn { padding: 0.7rem 1.8rem; border-radius: 12px; font-weight: 600; cursor: pointer; transition: var(--transition-smooth); border: none; font-family: 'Comfortaa', cursive; font-size: 0.95rem; }
        .quiz-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .quiz-btn.submit { background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary)); color: white; width: 100%; }
        .quiz-btn.submit:hover:not(:disabled) { box-shadow: 0 6px 25px rgba(255, 107, 157, 0.5); transform: translateY(-2px); }
        .quiz-progress { display: flex; gap: 0.3rem; margin-bottom: 0.8rem; justify-content: center; }
        .progress-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--glass-border); transition: var(--transition-smooth); }
        .progress-dot.active { background: var(--accent-gold); transform: scale(1.3); }
        
        .sending-status { text-align: center; margin-top: 12px; font-size: 0.9rem; color: #94a3b8; display: none; font-family: 'Inter', sans-serif; }
        .sending-status.show { display: block; }
        
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99; }
        @media (max-width: 400px) { .game-controls { gap: 4px; } .ctrl-btn { padding: 5px 10px; font-size: 0.75rem; } .score-val { font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div id="stars-container"></div>
    <canvas id="confetti-canvas"></canvas>

    <div class="app-container">
        <div class="main-header">
            <a href="../index.html" class="back-link">← Back to exercises</a>
            <h1>⏳ Past Tenses </h1>
            <p>Play Tic-Tac-Toe! Answer grammar questions to make your move.</p>
        </div>

        <!-- Форма ввода имени -->
        <div class="student-form" id="studentForm">
            <h2>🌟 Welcome!</h2>
            <p>Please enter your name to start the game</p>
            <input type="text" class="name-input" id="studentName" placeholder="Your name">
            <br>
            <button class="btn-start" onclick="startGame()">Start Game </button>
        </div>

        <!-- Игровая зона -->
        <div class="game-area" id="gameArea">
            <div class="timer-bar" id="timerBar">
                <span>⏱️</span>
                <span id="timerDisplay">00:00</span>
                <span id="tabWarning" class="tab-warning" style="display: none;">
                    ⚠️ Tab switches: <span id="tabSwitchCount">0</span>
                </span>
            </div>

            <div class="game-header">
                <div class="turn-indicator" id="turnIndicator">Player ✨'s Turn</div>
                <div class="game-controls">
                    <button class="ctrl-btn" onclick="game.resetRound()">🔄 New Round</button>
                    <button class="ctrl-btn" onclick="game.resetScores()">🗑️ Reset</button>
                </div>
            </div>

            <div id="victory-banner"><div id="victory-text"></div></div>
            <div class="board-container" id="board" role="grid" aria-label="Tic Tac Toe Board"></div>

            <div class="sending-status" id="sendingStatus"></div>
        </div>

        <footer>
            <div class="score-box"><div class="score-label">Player ✨</div><div class="score-val" id="score-x">0</div></div>
            <div class="score-box"><div class="score-label">Draws</div><div class="score-val" id="score-draw">0</div></div>
            <div class="score-box"><div class="score-label">Player 🌙</div><div class="score-val" id="score-o">0</div></div>
        </footer>
    </div>

    <!-- Модальное окно вопроса -->
    <div class="modal-overlay" id="quiz-modal" role="dialog" aria-modal="true">
        <div class="quiz-modal">
            <div class="quiz-header">
                <span class="quiz-icon">📚</span>
                <span class="quiz-title">Grammar Challenge!</span>
            </div>
            <div class="quiz-progress" id="quiz-progress">
                <div class="progress-dot active"></div><div class="progress-dot"></div><div class="progress-dot"></div>
            </div>
            <div class="quiz-question" id="quiz-question">Loading question...</div>
            <div class="quiz-options" id="quiz-options" role="radiogroup"></div>
            <div class="quiz-feedback" id="quiz-feedback" role="status" aria-live="polite"></div>
            <div class="quiz-actions">
                <button class="quiz-btn submit" id="quiz-submit" onclick="quiz.submitAnswer()" disabled>Submit Answer</button>
            </div>
        </div>
    </div>

    <script>
        const POWER_AUTOMATE_URL = 'ВСТАВЬТЕ_СЮДА_ВАШУ_ССЫЛКУ_ИЗ_POWER_AUTOMATE';
        let studentName = '';
        let startTime = null;
        let timerInterval = null;
        let tabSwitchCount = 0;
        let isGameActive = false;
        let roundStats = { correct: 0, incorrect: 0, total: 0 };

        //  МАГИЧЕСКИЙ ФОН (как в GSE заданиях)
        function createStars() {
            const container = document.getElementById('stars-container');
            for (let i = 0; i < 250; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.cssText = `width: ${size}px; height: ${size}px; left: ${Math.random() * 100}%; top: ${Math.random() * 100}%; --duration: ${Math.random() * 3 + 2}s; --delay: ${Math.random() * 5}s; --opacity: ${Math.random() * 0.7 + 0.3};`;
                container.appendChild(star);
            }
            for (let i = 0; i < 5; i++) {
                const shootingStar = document.createElement('div');
                shootingStar.style.position = 'absolute';
                shootingStar.style.width = '150px';
                shootingStar.style.height = '1px';
                shootingStar.style.background = 'linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.3) 30%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.3) 70%, rgba(255,255,255,0))';
                shootingStar.style.top = Math.random() * 50 + '%';
                shootingStar.style.left = '-' + Math.random() * 20 + '%';
                shootingStar.style.transform = 'rotate(-35deg)';
                shootingStar.style.filter = 'blur(0.5px)';
                shootingStar.style.animation = `shootingStar ${Math.random() * 6 + 10}s ease-in-out ${Math.random() * 15}s infinite`;
                container.appendChild(shootingStar);
            }
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = '4px';
                particle.style.height = '4px';
                particle.style.background = 'rgba(192, 132, 252, 0.8)';
                particle.style.borderRadius = '50%';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.boxShadow = '0 0 10px rgba(192, 132, 252, 0.8)';
                particle.style.animation = `magicParticles ${Math.random() * 4 + 3}s ease-in-out ${Math.random() * 5}s infinite`;
                container.appendChild(particle);
            }
        }
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shootingStar { 0% { transform: translateX(0) translateY(0) rotate(-35deg); opacity: 0; } 15% { opacity: 0.6; } 50% { opacity: 0.9; } 85% { opacity: 0.6; } 100% { transform: translateX(150vw) translateY(100vh) rotate(-35deg); opacity: 0; } }
            @keyframes magicParticles { 0% { opacity: 0; transform: translateY(0) translateX(0) scale(0); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(-100px) translateX(50px) scale(1); } }
        `;
        document.head.appendChild(style);
        createStars();

        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.95) {
                const spark = document.createElement('div');
                spark.style.position = 'fixed';
                spark.style.left = e.clientX + 'px';
                spark.style.top = e.clientY + 'px';
                spark.style.width = '3px';
                spark.style.height = '3px';
                spark.style.background = 'rgba(192, 132, 252, 0.8)';
                spark.style.borderRadius = '50%';
                spark.style.pointerEvents = 'none';
                spark.style.zIndex = '9999';
                spark.style.boxShadow = '0 0 10px rgba(192, 132, 252, 0.8)';
                spark.style.animation = 'magicParticles 1s ease-out forwards';
                document.body.appendChild(spark);
                setTimeout(() => { spark.remove(); }, 1000);
            }
        });

        // Вопросы
        const rawQuizData = [
            "Yesterday I ___ to the park with my friends.,go,went,gone,2",
            "While I ___ my homework, my mom called me.,did,was doing,had done,2",
            "When we arrived at the cinema, the film had already ___. ,start,started,starting,2",
            "She ___ a beautiful song at the party last night.,sang,was singing,had sung,1",
            "At 8 PM yesterday, I ___ dinner with my family.,had,was having,had had,2",
            "They ___ to London before they moved to Paris.,went,had gone,was going,2",
            "What ___ you doing when I called you?,did,were,had,2",
            "He ___ his keys, so he couldn't enter the house.,lost,was losing,had lost,3",
            "We ___ a great time at the beach last summer.,had,was having,had had,1",
            "While they ___ football, it started to rain.,played,were playing,had played,2",
            "I had never ___ such a funny movie before.,see,saw,seen,3",
            "My sister ___ her birthday party when I came home.,had,was having,had had,2",
            "After she ___ her homework, she went out to play.,finished,was finishing,had finished,3",
            "___ you visit your grandparents last weekend?,Did,Were,Had,1",
            "The sun ___ when we left the house.,shone,was shining,had shone,2",
            "He ___ in this city for five years before he moved.,lived,was living,had lived,3",
            "What ___ you doing at 7 o'clock yesterday evening?,did,were,had,2",
            "They ___ the museum before it closed.,visited,were visiting,had visited,3",
            "I ___ my phone while I was walking to school.,dropped,was dropping,had dropped,1",
            "She ___ English for two years before she came to Moscow.,studied,was studying,had studied,3"
        ];
        const quizData = rawQuizData.map(q => {
            const parts = q.split(',');
            const correctIndex = parseInt(parts.pop());
            const opt3 = parts.pop(); const opt2 = parts.pop(); const opt1 = parts.pop();
            return { question: parts.join(','), options: [opt1, opt2, opt3], correct: correctIndex - 1 };
        });

        const quiz = {
            modal: document.getElementById('quiz-modal'),
            questionEl: document.getElementById('quiz-question'),
            optionsEl: document.getElementById('quiz-options'),
            feedbackEl: document.getElementById('quiz-feedback'),
            submitBtn: document.getElementById('quiz-submit'),
            progressDots: document.querySelectorAll('.progress-dot'),
            currentQuestion: null, selectedOption: null, attemptCount: 0, resolve: null,
            
            async askQuestion() {
                return new Promise((resolve) => {
                    this.resolve = resolve;
                    this.attemptCount = 0;
                    this.loadRandomQuestion();
                    this.showModal();
                });
            },
            loadRandomQuestion() {
                this.currentQuestion = quizData[Math.floor(Math.random() * quizData.length)];
                this.selectedOption = null;
                const parts = this.currentQuestion.question.split('___');
                this.questionEl.innerHTML = parts.length > 1 ? `${parts[0]}<span>___</span>${parts[1] || ''}` : this.currentQuestion.question;
                this.optionsEl.innerHTML = '';
                const letters = ['A', 'B', 'C'];
                this.currentQuestion.options.forEach((opt, idx) => {
                    const btn = document.createElement('div');
                    btn.className = 'quiz-option';
                    btn.innerHTML = `<span class="quiz-option-letter">${letters[idx]}</span> ${opt}`;
                    btn.onclick = () => this.selectOption(idx, btn);
                    this.optionsEl.appendChild(btn);
                });
                this.feedbackEl.textContent = '';
                this.feedbackEl.className = 'quiz-feedback';
                this.submitBtn.disabled = true;
                this.updateProgress();
            },
            selectOption(index, element) {
                if (this.feedbackEl.classList.contains('show')) return;
                document.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('selected'));
                element.classList.add('selected');
                this.selectedOption = index;
                this.submitBtn.disabled = false;
            },
            updateProgress() {
                this.progressDots.forEach((dot, idx) => dot.classList.toggle('active', idx <= Math.min(this.attemptCount, 2)));
            },
            async submitAnswer() {
                if (this.selectedOption === null) return;
                const options = document.querySelectorAll('.quiz-option');
                const isCorrect = this.selectedOption === this.currentQuestion.correct;
                options.forEach(el => el.style.pointerEvents = 'none');
                this.submitBtn.disabled = true;
                roundStats.total++;
                
                if (isCorrect) {
                    options[this.selectedOption].classList.add('correct');
                    this.showFeedback('Absolutely right! ✨ Making your move...', 'correct');
                    roundStats.correct++;
                    confetti.burst(30, { x: window.innerWidth/2, y: window.innerHeight/2 });
                    setTimeout(() => { this.hideModal(); if (this.resolve) this.resolve(true); }, 1500);
                } else {
                    options[this.selectedOption].classList.add('incorrect');
                    options[this.currentQuestion.correct].classList.add('correct');
                    this.showFeedback("Not quite! Let's try another question. 💪", 'incorrect');
                    roundStats.incorrect++;
                    this.attemptCount++;
                    this.updateProgress();
                    setTimeout(() => { this.loadRandomQuestion(); }, 2000);
                }
            },
            showFeedback(text, type) { this.feedbackEl.textContent = text; this.feedbackEl.classList.add('show', type); },
            showModal() { this.modal.classList.add('active'); document.body.style.overflow = 'hidden'; },
            hideModal() { this.modal.classList.remove('active'); document.body.style.overflow = ''; }
        };

        const game = {
            board: Array(9).fill(null), currentPlayer: 'X', gameActive: true, pendingMove: null,
            scores: { X: 0, O: 0, draw: 0 },
            winningCombos: [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]],

            init() { this.renderBoard(); },
            resetRound() {
                this.board.fill(null); this.gameActive = true; this.pendingMove = null; this.currentPlayer = 'X';
                document.querySelectorAll('.cell').forEach(cell => { cell.innerHTML = ''; cell.classList.remove('taken', 'win', 'disabled'); });
                document.getElementById('victory-banner').classList.remove('visible');
                document.getElementById('turnIndicator').textContent = "Player ✨'s Turn";
                roundStats = { correct: 0, incorrect: 0, total: 0 };
            },
            resetScores() { this.scores = { X: 0, O: 0, draw: 0 }; this.updateScoreboard(); this.resetRound(); },

            async handleCellClick(index) {
                if (!this.gameActive || this.board[index] || this.pendingMove !== null) return;
                this.pendingMove = index;
                document.querySelectorAll('.cell:not(.taken)').forEach(c => c.classList.add('disabled'));
                await quiz.askQuestion();
                if (this.gameActive && this.pendingMove !== null) {
                    this.executeMove(this.pendingMove);
                    this.pendingMove = null;
                }
                document.querySelectorAll('.cell:not(.taken)').forEach(c => c.classList.remove('disabled'));
            },
            executeMove(index) {
                this.board[index] = this.currentPlayer;
                const cell = document.querySelector(`.cell[data-index='${index}']`);
                cell.classList.add('taken');
                const span = document.createElement('span');
                span.className = `glyph ${this.currentPlayer.toLowerCase()}`;
                span.textContent = this.currentPlayer === 'X' ? '✨' : '🌙';
                cell.appendChild(span);
                if (this.checkWin()) { this.endGame(false); }
                else if (this.board.every(cell => cell !== null)) { this.endGame(true); }
                else { this.currentPlayer = this.currentPlayer === 'X' ? 'O' : 'X'; document.getElementById('turnIndicator').textContent = `Player ${this.currentPlayer === 'X' ? '✨' : ''}'s Turn`; }
            },
            checkWin() {
                return this.winningCombos.some(combo => {
                    const [a, b, c] = combo;
                    if (this.board[a] && this.board[a] === this.board[b] && this.board[a] === this.board[c]) {
                        combo.forEach(i => document.querySelector(`.cell[data-index='${i}']`).classList.add('win'));
                        return true;
                    }
                    return false;
                });
            },
            endGame(isDraw) {
                this.gameActive = false;
                const banner = document.getElementById('victory-banner');
                const text = document.getElementById('victory-text');
                if (isDraw) {
                    this.scores.draw++; text.textContent = "It's a Draw! 🤝";
                } else {
                    this.scores[this.currentPlayer]++;
                    text.textContent = `Player ${this.currentPlayer === 'X' ? '✨' : '🌙'} Wins!`;
                    confetti.start();
                }
                banner.classList.add('visible');
                this.updateScoreboard();
                sendResultsToTeams(isDraw);
            },
            renderBoard() {
                const boardEl = document.getElementById('board');
                for (let i = 0; i < 9; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell'; cell.dataset.index = i;
                    cell.addEventListener('click', () => game.handleCellClick(i));
                    boardEl.appendChild(cell);
                }
            },
            updateScoreboard() {
                document.getElementById('score-x').textContent = this.scores.X;
                document.getElementById('score-o').textContent = this.scores.O;
                document.getElementById('score-draw').textContent = this.scores.draw;
            }
        };

        function startGame() {
            const nameInput = document.getElementById('studentName');
            studentName = nameInput.value.trim();
            if (studentName === '') {
                nameInput.style.borderColor = '#f87171';
                alert('Please enter your name!');
                return;
            }
            document.getElementById('studentForm').style.display = 'none';
            document.getElementById('gameArea').classList.add('show');
            game.init();
            startTime = Date.now();
            isGameActive = true;
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            if (!isGameActive) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timerDisplay').textContent = String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }

        document.addEventListener('visibilitychange', function() {
            if (!isGameActive) return;
            if (document.hidden) {
                tabSwitchCount++;
                document.getElementById('tabSwitchCount').textContent = tabSwitchCount;
                document.getElementById('tabWarning').style.display = 'inline';
                alert('⚠️ WARNING: You left the game tab!\n\nThis has been recorded and will be sent to your teacher.\nTab switches: ' + tabSwitchCount);
            }
        });

        async function sendResultsToTeams(isDraw) {
            const statusDiv = document.getElementById('sendingStatus');
            statusDiv.classList.add('show');
            statusDiv.textContent = '📤 Sending results to teacher...';
            statusDiv.style.color = '#94a3b8';

            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const timeSpent = minutes + ' min ' + seconds + ' sec';

            let resultText = '';
            if (isDraw) {
                resultText = "It's a Draw 🤝";
            } else {
                resultText = `Player ${game.currentPlayer === 'X' ? '✨' : '🌙'} Wins!`;
            }

            const payload = {
                student_name: studentName,
                score: `${game.scores.X} : ${game.scores.O} (Draws: ${game.scores.draw})`,
                percentage: roundStats.total > 0 ? Math.round((roundStats.correct / roundStats.total) * 100) + '%' : '0%',
                time: new Date().toLocaleString(),
                exercise_name: 'Past Tenses (Tic-Tac-Toe)',
                round_result: resultText,
                questions_answered: roundStats.total,
                correct_answers: roundStats.correct,
                incorrect_answers: roundStats.incorrect,
                time_spent: timeSpent,
                tab_switches: tabSwitchCount === 0 ? '0 (no switches)' : tabSwitchCount + ' switch(es) detected ⚠️'
            };

            try {
                const response = await fetch(POWER_AUTOMATE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    statusDiv.textContent = '✅ Results sent to Teams successfully!';
                    statusDiv.style.color = '#4ade80';
                } else {
                    statusDiv.textContent = '⚠️ Error sending results.';
                    statusDiv.style.color = '#fbbf24';
                }
            } catch (error) {
                statusDiv.textContent = '⚠️ Network error.';
                statusDiv.style.color = '#f87171';
            }
            setTimeout(() => { statusDiv.classList.remove('show'); }, 6000);
        }

        const confetti = {
            canvas: document.getElementById('confetti-canvas'), ctx: null, particles: [], animationId: null,
            colors: ['#ffd93d', '#ff6b9d', '#7b68ee', '#00d9a5', '#ffffff'],
            init() { this.ctx = this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize()); },
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
            start(duration = 3000) {
                this.particles = [];
                for (let i = 0; i < 150; i++) {
                    this.particles.push({ x: Math.random() * this.canvas.width, y: Math.random() * this.canvas.height - this.canvas.height, size: Math.random() * 8 + 4, color: this.colors[Math.floor(Math.random() * this.colors.length)], speedY: Math.random() * 3 + 2, speedX: Math.random() * 2 - 1, rotation: Math.random() * 360, rotationSpeed: Math.random() * 10 - 5, shape: Math.random() > 0.5 ? 'circle' : 'square' });
                }
                this.animate(); setTimeout(() => this.stop(), duration);
            },
            burst(count = 50, pos = { x: window.innerWidth/2, y: window.innerHeight/2 }) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({ x: pos.x, y: pos.y, size: Math.random() * 6 + 3, color: this.colors[Math.floor(Math.random() * this.colors.length)], speedY: (Math.random() - 0.5) * 4, speedX: (Math.random() - 0.5) * 4, rotation: Math.random() * 360, rotationSpeed: Math.random() * 10 - 5, shape: Math.random() > 0.5 ? 'circle' : 'square', life: 60 });
                }
                if (!this.animationId) this.animate();
            },
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles = this.particles.filter(p => {
                    if (p.life !== undefined) { p.life--; if (p.life <= 0) return false; }
                    p.y += p.speedY; p.x += p.speedX; p.rotation += p.rotationSpeed;
                    this.ctx.save(); this.ctx.translate(p.x, p.y); this.ctx.rotate((p.rotation * Math.PI) / 180); this.ctx.fillStyle = p.color;
                    if (p.shape === 'circle') { this.ctx.beginPath(); this.ctx.arc(0, 0, p.size/2, 0, Math.PI * 2); this.ctx.fill(); }
                    else { this.ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size); }
                    this.ctx.restore();
                    return p.y < this.canvas.height + 20;
                });
                if (this.particles.length > 0) this.animationId = requestAnimationFrame(() => this.animate()); else this.animationId = null;
            },
            stop() { cancelAnimationFrame(this.animationId); this.animationId = null; this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
        };

        confetti.init();
    </script>
</body>
</html>
