<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Passive Voice Star Catcher - Grammar Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body {
            font-family: 'Comfortaa', cursive;
            background: #0a0e27;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent);
            background-size: 200% 200%;
            animation: twinkle 5s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
        
        .back-to-exercises-btn {
            position: fixed; top: 20px; left: 20px; width: 50px; height: 50px;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%;
            color: white; font-size: 1.5em; font-weight: bold; cursor: pointer;
            z-index: 9999; box-shadow: 0 4px 20px rgba(192, 132, 252, 0.4);
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; transition: all 0.3s ease;
        }
        .back-to-exercises-btn:hover { transform: scale(1.1); }

        .game-container {
            position: relative; z-index: 1; width: 100%; max-width: 800px;
            margin: 0 auto; height: 100vh; display: flex; flex-direction: column;
        }
        .ui-bar {
            display: flex; justify-content: space-between; padding: 20px;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-box {
            text-align: center; font-family: 'Fredoka', sans-serif; font-size: 1.2em;
        }
        .stat-value { font-size: 1.5em; font-weight: 700; color: #c084fc; }
        .stat-value.lives { color: #f87171; }

        .game-area {
            flex: 1; position: relative; overflow: hidden; cursor: none;
        }
        
        .player {
            position: absolute; bottom: 20px; width: 80px; height: 80px;
            background: radial-gradient(circle, rgba(192, 132, 252, 0.8) 0%, rgba(96, 165, 250, 0.4) 100%);
            border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 50%;
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.6);
            display: flex; align-items: center; justify-content: center;
            font-size: 2em; transform: translateX(-50%); transition: transform 0.1s;
        }
        
        .falling-item {
            position: absolute; padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px;
            font-family: 'Comfortaa', cursive; font-weight: 600; font-size: 0.9em;
            white-space: nowrap; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transform: translateX(-50%);
        }
        .falling-item.correct { border-color: #4ade80; color: #4ade80; box-shadow: 0 0 15px rgba(74, 222, 128, 0.4); }
        .falling-item.wrong { border-color: #f87171; color: #f87171; box-shadow: 0 0 15px rgba(248, 113, 113, 0.4); }

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 14, 39, 0.9); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; text-align: center; padding: 20px;
        }
        .overlay.hidden { display: none; }
        .overlay h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2.5em;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .overlay p { font-size: 1.1em; color: #a0aec0; margin-bottom: 30px; max-width: 500px; line-height: 1.6; }
        .btn-start {
            padding: 15px 40px; background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
            border: none; border-radius: 50px; color: white; font-family: 'Comfortaa', cursive;
            font-size: 1.2em; font-weight: 700; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(167, 139, 250, 0.4);
        }
        .btn-start:hover { transform: translateY(-3px) scale(1.05); }

        .particle {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            pointer-events: none; animation: fadeOut 0.8s forwards;
        }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px) scale(0); } }

        @media (max-width: 600px) {
            .player { width: 60px; height: 60px; font-size: 1.5em; }
            .falling-item { font-size: 0.8em; padding: 8px 14px; }
            .overlay h2 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-to-exercises-btn" onclick="localStorage.setItem('lastActiveTab', 'targeted'); localStorage.setItem('returnFromExercise', 'true')">←</a>
    
    <div class="game-container">
        <div class="ui-bar">
            <div class="stat-box">Score<div class="stat-value" id="score">0</div></div>
            <div class="stat-box">Target<div class="stat-value">50</div></div>
            <div class="stat-box">Lives<div class="stat-value lives" id="lives">3</div></div>
        </div>
        
        <div class="game-area" id="gameArea">
            <div class="player" id="player">🌟</div>
        </div>

        <div class="overlay" id="startScreen">
            <h2>Passive Voice Star Catcher</h2>
            <p>Move your mouse or finger to control the magic star. <br>
            Catch only <b>Passive Voice</b> forms (e.g., <i>was built, is made</i>).<br>
            Avoid Active Voice forms (e.g., <i>built, makes</i>)!</p>
            <button class="btn-start" onclick="startGame()">Start Game</button>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <h2 id="endTitle">Game Over!</h2>
            <p id="endMessage">You caught 0 stars.</p>
            <button class="btn-start" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const words = [
            { text: "is made", correct: true }, { text: "makes", correct: false },
            { text: "was built", correct: true }, { text: "built", correct: false },
            { text: "were seen", correct: true }, { text: "saw", correct: false },
            { text: "has been done", correct: true }, { text: "has done", correct: false },
            { text: "will be solved", correct: true }, { text: "will solve", correct: false },
            { text: "was written", correct: true }, { text: "wrote", correct: false },
            { text: "are invited", correct: true }, { text: "invite", correct: false },
            { text: "was stolen", correct: true }, { text: "stole", correct: false }
        ];

        let score = 0, lives = 3, gameActive = false, animationId;
        let items = [], spawnTimer = 0, playerX = 50;
        const gameArea = document.getElementById('gameArea');
        const player = document.getElementById('player');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');

        // Управление мышью и тачем
        function movePlayer(e) {
            if (!gameActive) return;
            const rect = gameArea.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            playerX = ((clientX - rect.left) / rect.width) * 100;
            playerX = Math.max(5, Math.min(95, playerX));
            player.style.left = playerX + '%';
        }
        gameArea.addEventListener('mousemove', movePlayer);
        gameArea.addEventListener('touchmove', movePlayer, { passive: false });

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            score = 0; lives = 3; items = []; spawnTimer = 0;
            scoreEl.textContent = score; livesEl.textContent = lives;
            gameActive = true;
            gameLoop();
        }

        function spawnItem() {
            const wordData = words[Math.floor(Math.random() * words.length)];
            const el = document.createElement('div');
            el.className = 'falling-item';
            el.textContent = wordData.text;
            el.dataset.correct = wordData.correct;
            el.style.left = (Math.random() * 80 + 10) + '%';
            el.style.top = '-50px';
            gameArea.appendChild(el);
            items.push({ el, y: -50, speed: Math.random() * 1.5 + 1.5, correct: wordData.correct });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.background = color;
                p.style.transform = `translate(${(Math.random()-0.5)*40}px, ${(Math.random()-0.5)*40}px)`;
                gameArea.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            spawnTimer++;
            if (spawnTimer > 60) { spawnItem(); spawnTimer = 0; }

            const playerRect = player.getBoundingClientRect();
            const areaRect = gameArea.getBoundingClientRect();

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.speed;
                item.el.style.top = item.y + 'px';

                const itemRect = item.el.getBoundingClientRect();
                
                // Проверка столкновения
                if (itemRect.bottom >= playerRect.top + 20 && itemRect.top <= playerRect.bottom &&
                    itemRect.right >= playerRect.left + 20 && itemRect.left <= playerRect.right - 20) {
                    
                    if (item.correct) {
                        score += 10;
                        scoreEl.textContent = score;
                        createParticles(itemRect.left + itemRect.width/2 - areaRect.left, itemRect.top, '#4ade80');
                    } else {
                        lives--;
                        livesEl.textContent = lives;
                        createParticles(itemRect.left + itemRect.width/2 - areaRect.left, itemRect.top, '#f87171');
                        player.style.transform = 'translateX(-50%) shake';
                        setTimeout(() => player.style.transform = 'translateX(-50%)', 200);
                    }
                    item.el.remove();
                    items.splice(i, 1);
                    
                    if (lives <= 0) endGame(false);
                    if (score >= 50) endGame(true);
                    continue;
                }

                // Удаление если ушло за экран
                if (item.y > areaRect.height) {
                    item.el.remove();
                    items.splice(i, 1);
                }
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        function endGame(win) {
            gameActive = false;
            cancelAnimationFrame(animationId);
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('endTitle').textContent = win ? '🎉 Mission Accomplished!' : '💔 Game Over';
            document.getElementById('endMessage').textContent = win ? 
                `Amazing! You caught enough Passive Voice stars! Score: ${score}` : 
                `You ran out of lives. Final score: ${score}. Keep practicing!`;
            
            // Сохранение в лидерборд
            if (win) {
                try {
                    const results = JSON.parse(localStorage.getItem('grammarResults') || '[]');
                    const name = prompt('Enter your name for the leaderboard:') || 'Anonymous';
                    results.push({ name, exercise: "Passive Voice Game", score: 100, date: new Date().toISOString() });
                    localStorage.setItem('grammarResults', JSON.stringify(results));
                } catch(e) {}
            }
        }

        function resetGame() {
            items.forEach(item => item.el.remove());
            items = [];
            startGame();
        }
    </script>
</body>
</html>
