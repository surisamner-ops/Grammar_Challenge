<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Brainstorm</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Comfortaa', cursive;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }
        
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
                @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes magicParticles {
            0% { opacity: 0; transform: translateY(0) translateX(0) scale(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) translateX(50px) scale(1); }
        }
        
        .container {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #c084fc, #60a5fa, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .question {
            text-align: center;
            color: #c4b5fd;
            font-size: 1.2em;
            margin-bottom: 30px;
            font-weight: 400;
        }
        
        .input-section {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(192, 132, 252, 0.3);
    border-radius: 50px;
    padding: 20px;
    margin-bottom: 25px;
    display: flex;
    gap: 15px;
    justify-content: center;
    box-shadow: 0 0 30px rgba(192, 132, 252, 0.2);
    animation: windowGlow 3s ease-in-out infinite;
}

@keyframes windowGlow {
    0%, 100% { 
        box-shadow: 0 0 30px rgba(192, 132, 252, 0.2), 
                    0 0 60px rgba(192, 132, 252, 0.1); 
    }
    50% { 
        box-shadow: 0 0 50px rgba(192, 132, 252, 0.4), 
                    0 0 80px rgba(192, 132, 252, 0.2),
                    0 0 100px rgba(96, 165, 250, 0.15); 
    }
}
    .input-section input {
    flex: 1;
    max-width: 400px;
    padding: 15px 25px;
    background: rgba(0,0,0,0.3);
    border: 2px solid rgba(192, 132, 252, 0.5);
    border-radius: 50px;
    color: white;
    font-size: 1.1em;
    font-family: 'Comfortaa', cursive;
    text-align: center;
    box-shadow: 0 0 30px rgba(192, 132, 252, 0.3);
    animation: inputGlow 2s ease-in-out infinite;
}
.input-section input:focus {
    outline: none;
    border-color: #c084fc;
    box-shadow: 0 0 50px rgba(192, 132, 252, 0.6), 0 0 80px rgba(192, 132, 252, 0.4);
}

@keyframes inputGlow {
    0%, 100% { box-shadow: 0 0 30px rgba(192, 132, 252, 0.3); }
    50% { box-shadow: 0 0 50px rgba(192, 132, 252, 0.5), 0 0 70px rgba(192, 132, 252, 0.3); }
}
        .input-section button {
            padding: 15px 35px;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.4);
        }
        .input-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 25px rgba(192, 132, 252, 0.6);
        }
        
        .qr-section {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 15px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(192, 132, 252, 0.3);
    border-radius: 16px;
    z-index: 1000;
    box-shadow: 0 0 25px rgba(192, 132, 252, 0.3);
    animation: qrGlow 2.5s ease-in-out infinite;
}

@keyframes qrGlow {
    0%, 100% { 
        box-shadow: 0 0 25px rgba(192, 132, 252, 0.3), 
                    0 0 50px rgba(192, 132, 252, 0.15); 
    }
    50% { 
        box-shadow: 0 0 40px rgba(192, 132, 252, 0.5), 
                    0 0 70px rgba(192, 132, 252, 0.3),
                    0 0 90px rgba(96, 165, 250, 0.2); 
    }
}
        .qr-section h2 {
            color: #c084fc;
            font-size: 0.85em;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 600;
        }
       #qrcode {
    display: block;
    background: white;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(192, 132, 252, 0.4);
}
        .qr-hint {
            color: #94a3b8;
            margin-top: 8px;
            font-size: 0.75em;
            text-align: center;
        }
        
      .cloud-container {
    position: relative;
    z-index: 2;
    padding: 20px;
    min-height: 500px;
    display: flex;
    justify-content: center;
    align-items: center;
}
        #wordcloud {
            width: 100%;
            height: 450px;
        }
        
        .back-to-exercises-btn {
    position: fixed;
    top: 30px;
    left: 30px;
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #c084fc, #60a5fa);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    color: white;
    font-size: 1.2em;
    font-weight: bold;
    cursor: pointer;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(192, 132, 252, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: all 0.3s ease;
    opacity: 0.9;
}
.back-to-exercises-btn:hover {
    transform: translateY(-5px) scale(1.1);
    box-shadow: 0 8px 30px rgba(192, 132, 252, 0.6);
    opacity: 1;
}
.back-to-exercises-btn .btn-text {
    position: absolute;
    left: 85px;
    background: rgba(192, 132, 252, 0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(192, 132, 252, 0.4);
    padding: 10px 18px;
    border-radius: 50px;
    font-family: 'Comfortaa', cursive;
    font-size: 1em;
    font-weight: 600;
    color: #e9d5ff;
    white-space: nowrap;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    letter-spacing: 0.5px;
}
.back-to-exercises-btn:hover .btn-text {
    opacity: 1;
    transform: translateX(5px);
}
        
        .status {
            text-align: center;
            color: #4ade80;
            margin-top: 15px;
            min-height: 20px;
            font-weight: 600;
        }
        
        .loading-msg {
            text-align: center;
            color: #94a3b8;
            font-size: 1.2em;
            padding: 40px;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            .question { font-size: 1em; }
            .input-section { flex-direction: column; padding: 15px; }
            .input-section input { max-width: 100%; }
            .qr-section {
                top: 10px;
                right: 10px;
                padding: 10px;
            }
            #qrcode { padding: 5px; }
            #qrcode img, #qrcode canvas {
                width: 100px !important;
                height: 100px !important;
            }
            .cloud-container { min-height: 300px; padding: 15px; }
            #wordcloud { height: 300px; }
        }
    </style>
</head>
<body>
    <div class="stars-bg" id="starsContainer"></div>
    
    <div class="qr-section">
        <h2> Scan to join!</h2>
        <div id="qrcode"></div>
        <p class="qr-hint">Open on your phone</p>
    </div>
    
    <div class="container">
        <h1>🧠 Live Brainstorm</h1>
        <p class="question">What words come to mind when you think about ... ?</p>
        
        <div class="input-section">
            <input type="text" id="wordInput" placeholder="Type your word..." maxlength="30">
            <button onclick="submitWord()">Submit ✨</button>
        </div>
        <div class="status" id="status"></div>
        
        <div class="cloud-container">
            <div id="wordcloud">
                <div class="loading-msg">Loading word cloud...</div>
            </div>
        </div>
        
      <a href="index.html" class="back-to-exercises-btn" onclick="localStorage.removeItem('lastActiveTab'); localStorage.removeItem('returnFromExercise');">
    <span>←</span>
    <span class="btn-text">Back to exercises</span>
</a>
    </div>

    <!-- Загружаем библиотеки -->
    <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <script>
        // ️ ВСТАВЬ СЮДА СВОЙ URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzRQlr3v51D5GJ1QS7lhmmVyefuhH5HZ-49IWSwEgW0xhnyiadULpIOfPK2PCdaZUGa/exec';
        
        const wordInput = document.getElementById('wordInput');
        const status = document.getElementById('status');
        const wordcloudDiv = document.getElementById('wordcloud');
        
        // Создаём звёзды
       function createStars() {
    const container = document.getElementById('starsContainer');
    // Увеличиваем с 200 до 400 звёзд
    for (let i = 0; i < 400; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
        star.style.setProperty('--max-opacity', Math.random() * 0.7 + 0.3);
        star.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(star);
    }
    // Увеличиваем падающие звёзды с 5 до 10
    for (let i = 0; i < 10; i++) {
        const shootingStar = document.createElement('div');
        shootingStar.style.position = 'absolute';
        shootingStar.style.width = '150px';
        shootingStar.style.height = '1px';
        shootingStar.style.background = 'linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.3) 30%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.3) 70%, rgba(255,255,255,0))';
        shootingStar.style.top = Math.random() * 50 + '%';
        shootingStar.style.left = '-' + Math.random() * 20 + '%';
        shootingStar.style.transform = 'rotate(-35deg)';
        shootingStar.style.filter = 'blur(0.5px)';
        shootingStar.style.animation = `shootingStar ${Math.random() * 6 + 10}s ease-in-out ${Math.random() * 15}s infinite`;
        container.appendChild(shootingStar);
    }
    // Увеличиваем частицы с 15 до 30
    for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.style.position = 'absolute';
        particle.style.width = '4px';
        particle.style.height = '4px';
        particle.style.background = 'rgba(192, 132, 252, 0.8)';
        particle.style.borderRadius = '50%';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.boxShadow = '0 0 10px rgba(192, 132, 252, 0.8)';
        particle.style.animation = `magicParticles ${Math.random() * 4 + 3}s ease-in-out ${Math.random() * 5}s infinite`;
        container.appendChild(particle);
    }
}
        
        // Отправка слова
        async function submitWord() {
            const word = wordInput.value.trim();
            if (!word) {
                status.textContent = 'Please type a word first!';
                status.style.color = '#f87171';
                return;
            }
            
            status.textContent = 'Sending...';
            status.style.color = '#fbbf24';
            
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word: word, question: 'brainstorm' })
                });
                
                wordInput.value = '';
                status.textContent = '✅ Added! Refreshing...';
                status.style.color = '#4ade80';
                setTimeout(() => { status.textContent = ''; }, 2000);
                setTimeout(loadCloud, 1500);
            } catch (e) {
                status.textContent = 'Error. Try again.';
                status.style.color = '#f87171';
            }
        }
        
        // Загрузка облака
        async function loadCloud() {
            try {
                const response = await fetch(SCRIPT_URL);
                const words = await response.json();
                
                console.log('Words loaded:', words);
                
                if (!words || words.length === 0) {
                    wordcloudDiv.innerHTML = '<div class="loading-msg">Be the first to add a word! 🌟</div>';
                    return;
                }
                
                // Создаём canvas для WordCloud
                wordcloudDiv.innerHTML = '';
                const canvas = document.createElement('canvas');
                canvas.id = 'wordcloudCanvas';
                canvas.width = wordcloudDiv.offsetWidth;
                canvas.height = wordcloudDiv.offsetHeight;
                wordcloudDiv.appendChild(canvas);
                
                const maxWeight = Math.max(...words.map(w => w[1]));
                const scaledWords = words.map(w => [w[0], Math.max(25, (w[1] / maxWeight) * 80)]);
                
                // Проверяем что WordCloud загружен
                if (typeof WordCloud === 'undefined') {
                    wordcloudDiv.innerHTML = '<div class="loading-msg">Loading library... Please wait</div>';
                    setTimeout(loadCloud, 2000);
                    return;
                }
                
               WordCloud(canvas, {
    list: scaledWords,
    gridSize: 8,
    weightFactor: 5,
                    fontFamily: 'Comfortaa',
                   color: function() {
    const colors = ['#c084fc', '#60a5fa', '#fbbf24', '#4ade80', '#f472b6', '#fb923c', '#a78bfa', '#38bdf8', '#facc15', '#34d399'];
    return colors[Math.floor(Math.random() * colors.length)];
},
                    backgroundColor: 'transparent',
                    rotateRatio: 0.3,
                    rotationSteps: 2,
                    drawOutOfBound: false,
                    shrinkToFit: true
                });
            } catch (e) {
                console.error('Error loading cloud:', e);
                wordcloudDiv.innerHTML = '<div class="loading-msg">Waiting for data... 📊</div>';
            }
        }
        
        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitWord();
        });
        
        // Генерация QR-кода
        const formUrl = 'https://surisamner-ops.github.io/Grammar_Challenge/brainstorm-form.html';
        if (typeof QRCode !== 'undefined') {
            new QRCode(document.getElementById("qrcode"), {
                text: formUrl,
                width: 120,
                height: 120,
                colorDark: "#1e293b",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }
        
        // Загружаем при старте
        window.addEventListener('load', () => {
             createStars(); // <--- ВОТ ЭТА СТРОЧКА ВЕРНЁТ ЗВЁЗДЫ!
            loadCloud();
            setInterval(loadCloud, 10000);
        });
    </script>
</body>
</html>
