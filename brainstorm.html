<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainstorm - Word Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/wordcloud2.js@1.2.2/src/wordcloud2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comfortaa', cursive;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .question {
            text-align: center;
            color: #c4b5fd;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .input-section {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .input-section input {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(192, 132, 252, 0.3);
            border-radius: 50px;
            color: white;
            font-size: 1em;
            font-family: 'Comfortaa', cursive;
        }
        .input-section input:focus {
            outline: none;
            border-color: #c084fc;
        }
        .input-section button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .input-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(192, 132, 252, 0.5);
        }
        .qr-section {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(192, 132, 252, 0.2);
            border-radius: 16px;
        }
        .qr-section h2 {
            color: #c084fc;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        #qrcode {
            display: inline-block;
            padding: 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.4);
        }
        .qr-hint {
            color: #94a3b8;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .cloud-container {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(192, 132, 252, 0.2);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }
        #wordcloud {
            width: 100%;
            height: 400px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background: rgba(192, 132, 252, 0.2);
            border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 50px;
            color: #e9d5ff;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(192, 132, 252, 0.3);
        }
        .status {
            text-align: center;
            color: #4ade80;
            margin-top: 10px;
            min-height: 20px;
        }
        .center { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Live Brainstorm</h1>
        <p class="question">What words come to mind when you think about ...?</p>
        
        <div class="input-section">
            <input type="text" id="wordInput" placeholder="Type your word..." maxlength="30">
            <button onclick="submitWord()">Submit ✨</button>
        </div>
        <div class="status" id="status"></div>
        
        <div class="qr-section">
            <h2>📱 Scan to join!</h2>
            <div id="qrcode"></div>
            <p class="qr-hint">Open this page on your phone to participate</p>
        </div>
        
        <div class="cloud-container">
            <canvas id="wordcloud"></canvas>
        </div>
        
        <div class="center">
            <a href="index.html" class="back-btn">← Back to exercises</a>
        </div>
    </div>

    <script>
        // ⚠️ ВСТАВЬ СЮДА СВОЙ URL ИЗ GOOGLE APPS SCRIPT
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzsrk5Vyp-krUWliGiHJFBLfL8zv8nha5PiqELC-TrGpPjuhlJy47coOIHL6sIWdoI/exec';
        
        const wordInput = document.getElementById('wordInput');
        const status = document.getElementById('status');
        const canvas = document.getElementById('wordcloud');
        
        // Отправка слова
        async function submitWord() {
            const word = wordInput.value.trim();
            if (!word) {
                status.textContent = 'Please type a word first!';
                status.style.color = '#f87171';
                return;
            }
            
            status.textContent = 'Sending...';
            status.style.color = '#fbbf24';
            
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word: word, question: 'brainstorm' })
                });
                
                wordInput.value = '';
                status.textContent = '✅ Added! Refreshing cloud...';
                status.style.color = '#4ade80';
                
                setTimeout(loadCloud, 2000);
            } catch (e) {
                status.textContent = 'Error. Try again.';
                status.style.color = '#f87171';
            }
        }
        
        // Загрузка облака слов
        async function loadCloud() {
            try {
                const response = await fetch(SCRIPT_URL);
                const words = await response.json();
                
                console.log('Loaded words:', words);
                
                if (words.length === 0) {
                    WordCloud(canvas, {
                        list: [['Be the first!', 20]],
                        gridSize: 10,
                        weightFactor: 15,
                        fontFamily: 'Comfortaa',
                        color: function() {
                            return ['#c084fc', '#60a5fa', '#fbbf24', '#4ade80', '#f87171'][Math.floor(Math.random() * 5)];
                        },
                        backgroundColor: 'transparent'
                    });
                    return;
                }
                
                // Увеличиваем веса для красивого облака
                const maxWeight = Math.max(...words.map(w => w[1]));
                const scaledWords = words.map(w => [w[0], Math.max(15, (w[1] / maxWeight) * 50)]);
                
                WordCloud(canvas, {
                    list: scaledWords,
                    gridSize: 8,
                    weightFactor: 1,
                    fontFamily: 'Comfortaa',
                    color: function(word, weight) {
                        if (weight > 30) return '#c084fc';
                        if (weight > 20) return '#60a5fa';
                        if (weight > 15) return '#fbbf24';
                        return '#4ade80';
                    },
                    backgroundColor: 'transparent',
                    rotateRatio: 0.3,
                    rotationSteps: 2,
                    drawOutOfBound: false,
                    shrinkToFit: true
                });
            } catch (e) {
                console.log('Error loading cloud:', e);
                WordCloud(canvas, {
                    list: [['Loading...', 20]],
                    gridSize: 10,
                    weightFactor: 15,
                    fontFamily: 'Comfortaa',
                    color: '#fbbf24',
                    backgroundColor: 'transparent'
                });
            }
        }
        
        // Enter для отправки
        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitWord();
        });
        
        // Генерация QR-кода
        const formUrl = 'https://surisamner-ops.github.io/Grammar_Challenge/brainstorm-form.html';
        new QRCode(document.getElementById("qrcode"), {
            text: formUrl,
            width: 200,
            height: 200,
            colorDark: "#1e293b",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        
        // Загружаем облако при старте и обновляем каждые 10 секунд
        loadCloud();
        setInterval(loadCloud, 10000);
    </script>
</body>
</html>
